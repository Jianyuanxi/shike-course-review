services:
  seekdb:
    image: oceanbase/seekdb:1.4.0-100000172026082615
    container_name: course-review-seekdb
    restart: unless-stopped
    ports:
      - "127.0.0.1:2881:2881"
      - "127.0.0.1:2886:2886"
    environment:
      ROOT_PASSWORD: ${SEEKDB_PASSWORD:-}
      SEEKDB_DATABASE: course_review
      MEMORY_LIMIT: ${SEEKDB_MEMORY_LIMIT:-2G}
      LOG_DISK_SIZE: ${SEEKDB_LOG_DISK_SIZE:-2G}
      DATAFILE_SIZE: ${SEEKDB_DATAFILE_SIZE:-2G}
    volumes:
      - seekdb-data:/var/lib/seekdb

  powercontext:
    build:
      context: https://github.com/oceanbase/powercontext.git#powercontext-v1.4.1
      dockerfile: docker/Dockerfile
      args:
        POWERCONTEXT_VERSION: 1.4.1
    image: course-review-powercontext:1.4.1
    container_name: course-review-powercontext
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POWERCONTEXT_SERVER_ACCESS_MODE: disabled
      POWERCONTEXT_SERVER_DASHBOARD_ENABLED: "true"
    volumes:
      - powercontext-data:/data

volumes:
  seekdb-data:
  powercontext-data:
